name: Promotion sync validation

on:
  push:
    paths:
      - "tradingagents/policy/promotion_sync.py"
      - "tests/test_promotion_sync.py"
      - ".github/workflows/promotion-sync-validation.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [master]
    paths:
      - "tradingagents/policy/promotion_sync.py"
      - "tests/test_promotion_sync.py"
      - ".github/workflows/promotion-sync-validation.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and static-analysis dependencies
        run: uv sync --locked --group static-analysis

      - name: Run focused promotion-sync tests
        run: uv run --no-sync --with pytest python -m pytest -q tests/test_promotion_sync.py

      - name: Ruff touched promotion-sync files
        run: uv run --no-sync --group static-analysis ruff check tradingagents/policy/promotion_sync.py tests/test_promotion_sync.py

      - name: Compile touched promotion-sync files
        run: uv run --no-sync python -m compileall -q tradingagents/policy/promotion_sync.py tests/test_promotion_sync.py
