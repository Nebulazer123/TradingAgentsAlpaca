name: Temporary PR 6 promotion sync validation

on:
  push:
    branches:
      - "codex/legacy-promotion-evidence-age-20260822"
    paths:
      - "tradingagents/policy/promotion_sync.py"
      - "tests/test_promotion_sync.py"
      - ".github/workflows/promotion-sync-validation.yml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run focused validation
        id: validate
        shell: bash
        run: |
          set +e

          uv sync --locked --group static-analysis >"$RUNNER_TEMP/uv-sync.log" 2>&1
          sync_status=$?

          if [ "$sync_status" -eq 0 ]; then
            uv run --no-sync --with pytest python -m pytest -q tests/test_promotion_sync.py >"$RUNNER_TEMP/pytest.log" 2>&1
            pytest_status=$?

            uv run --no-sync --group static-analysis ruff check tradingagents/policy/promotion_sync.py tests/test_promotion_sync.py >"$RUNNER_TEMP/ruff.log" 2>&1
            ruff_status=$?

            uv run --no-sync python -m compileall -q tradingagents/policy/promotion_sync.py tests/test_promotion_sync.py >"$RUNNER_TEMP/compileall.log" 2>&1
            compile_status=$?
          else
            pytest_status=125
            ruff_status=125
            compile_status=125
            printf '%s\n' "skipped because uv sync failed" >"$RUNNER_TEMP/pytest.log"
            printf '%s\n' "skipped because uv sync failed" >"$RUNNER_TEMP/ruff.log"
            printf '%s\n' "skipped because uv sync failed" >"$RUNNER_TEMP/compileall.log"
          fi

          failed=0
          for status in "$sync_status" "$pytest_status" "$ruff_status" "$compile_status"; do
            if [ "$status" -ne 0 ]; then
              failed=1
            fi
          done

          {
            echo "sync_status=$sync_status"
            echo "pytest_status=$pytest_status"
            echo "ruff_status=$ruff_status"
            echo "compile_status=$compile_status"
            echo "failed=$failed"
          } >>"$GITHUB_OUTPUT"

      - name: Post validation receipt to PR 6
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_STATUS: ${{ steps.validate.outputs.sync_status }}
          PYTEST_STATUS: ${{ steps.validate.outputs.pytest_status }}
          RUFF_STATUS: ${{ steps.validate.outputs.ruff_status }}
          COMPILE_STATUS: ${{ steps.validate.outputs.compile_status }}
          FAILED: ${{ steps.validate.outputs.failed }}
        shell: bash
        run: |
          {
            echo "## Promotion sync validation receipt"
            echo
            echo "Validated head: \`$GITHUB_SHA\`"
            echo
            echo "| Check | Exit code |"
            echo "| --- | ---: |"
            echo "| uv sync --locked --group static-analysis | ${SYNC_STATUS:-not-run} |"
            echo "| pytest tests/test_promotion_sync.py | ${PYTEST_STATUS:-not-run} |"
            echo "| Ruff promotion_sync.py + test_promotion_sync.py | ${RUFF_STATUS:-not-run} |"
            echo "| compileall touched Python files | ${COMPILE_STATUS:-not-run} |"
            echo
            if [ "${FAILED:-1}" = "0" ]; then
              echo "**Result: PASS**"
            else
              echo "**Result: FAIL**"
              for log in uv-sync pytest ruff compileall; do
                echo
                echo "<details><summary>${log} tail</summary>"
                echo
                echo '\`\`\`text'
                tail -80 "$RUNNER_TEMP/${log}.log" 2>/dev/null || true
                echo '\`\`\`'
                echo "</details>"
              done
            fi
          } >"$RUNNER_TEMP/pr-comment.md"

          gh pr comment 6 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-comment.md"

      - name: Fail workflow if validation failed
        if: steps.validate.outputs.failed != '0'
        run: exit 1
