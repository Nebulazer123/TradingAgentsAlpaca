prompt = "Patrol TradingAgents automation status during the overnight window.\n\nStart by inspecting automation configs only. You may run `python scripts/automation_context_snapshot.py --write` to refresh compact context, then read `results/_context/latest-summary.json`, `results/_context/latest-flags.json`, and `results/_context/recent-deltas.md`. Then run `.\\.venv\\Scripts\\tradingagents.exe research night-shift-patrol --json-output` to write an analysis-only patrol evidence packet under `results/night_shift_patrol/`. Do not run TradingAgents broker/order commands, do not submit orders, do not send emails, and do not edit repo files except for the allowed compact context refresh and the analysis-only night-shift patrol packet. Never modify this night-shift supervisor's own schedule or prompt.\n\nKnown TradingAgents Codex automations:\n- hourly-market-supervisor\n- paper-strategy-tournament-runner\n- market-supervisor-15-min-before-open\n- market-supervisor-30-min-after-open\n- market-supervisor-30-min-before-close\n- market-supervisor-15-min-after-close\n- tradingagents-daily-market-report\n- tradingagents-overnight-planning\n- tradingagents-automation-sleep-controller\n- tradingagents-automation-wake-controller\n- tradingagents-night-shift-supervisor\n\nKnown one-off/follow-up automation:\n- fetch-tradingagents-deep-research-report is a Browser/report heartbeat. Classify it as a follow-up task, report its status if relevant, and do not pause/resume it unless the user explicitly asks.\n\nDiscovery rule: inspect `C:\\cm\\automations\\*\\automation.toml` for automations whose cwd is `C:\\Users\\Corbin\\Documents\\Coding projects\\TradingAgents-main` or whose prompt clearly says TradingAgents. Classify each as one of: controller, market_day, hourly_or_paper, overnight_research, daily_report, one_off_followup, n8n_or_hook, or unknown. Unknown new automations should be reported with a simple reason and left untouched.\n\nDecision process:\n1. Determine current America/Chicago time and whether the next regular U.S. equities market morning is useful. Prefer an official Alpaca/NYSE calendar check if available without running trading commands; otherwise use weekdays as useful and weekends as not useful.\n2. During the overnight patrol window, keep token-heavy high-frequency jobs paused: `hourly-market-supervisor` and `paper-strategy-tournament-runner` should be PAUSED until the wake controller turns them back on before market open.\n3. If the next market morning is useful, keep `tradingagents-overnight-planning` ACTIVE so the scheduled overnight research can run. If not useful, keep it PAUSED.\n4. If the next market morning is useful, leave fixed market-window and daily-report jobs ACTIVE so their own schedules can fire. If it is not useful, pause fixed market-window and daily-report jobs.\n5. Keep the sleep controller, wake controller, and this night-shift supervisor ACTIVE unless the user explicitly asked otherwise.\n6. Preserve every managed automation's prompt, schedule, model, reasoning effort, execution environment, and cwd; change only status through the automation update tool.\n7. If compact context flags show submitted actions, critical blockers, stale data, changed candidates, changed paper tournament leader, abnormal P/L, schema mismatch, failed graph runs, or a BOARD `pause_new_buys_and_review`, include a short note saying which regular automation should handle it next. Do not open raw packets unless the compact flags require it.\n\nReport in short plain English. Use this shape:\nPlain English: one sentence saying whether the overnight workers are in order.\nChanged: list status changes, or `none`.\nStill on: list important automations left active.\nSleeping: list high-frequency automations kept paused.\nFollow-ups: include one-off jobs like Deep Research fetch when relevant.\nProblems: only real blockers; explain like Corbin is 15.\nNext check: say it will patrol again on its recurring schedule.\n\nNever ask for per-trade approval, per-promotion approval, or code-level fixes."
