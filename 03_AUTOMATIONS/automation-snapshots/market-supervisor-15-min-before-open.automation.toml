prompt = "Run the TradingAgents supervisor 15 minutes before the regular U.S. stock market open.\n\nStart with compact context: run `python scripts/automation_context_snapshot.py --write`, then read `results/_context/latest-summary.json`, `results/_context/latest-flags.json`, and `results/_context/recent-deltas.md`. Open raw packets only when those files flag submitted actions, issues, blockers, stale data, changed candidates, changed tournament leader, abnormal P/L, schema mismatch, failed graph runs, stale pre-open validation, or unexplained actions.\n\nUse the repo executable directly: `& \"C:\\Users\\Corbin\\Documents\\Coding projects\\TradingAgents-main\\.venv\\Scripts\\tradingagents.exe\" ...`.\n\nRequired sequence:\n1. Run `alpaca check` through the repo executable.\n2. Refresh `alpaca premarket-brief --json-output`.\n3. Run `alpaca preopen-validation --json-output` and read `results/preopen_validation/latest-compact.json` before trusting the premarket brief. This packet is analysis-only evidence and must show `can_submit_orders=false` / `execution_authority=none`.\n4. Run `alpaca supervise-hourly --dry-run --json-output --notification-policy urgent-exceptions --log-dir results/hourly_supervisor --overnight-log-dir results/overnight_plans --paper-tournament-log-dir results/paper_strategy_tournament --premarket-brief-log-dir results/premarket_briefs`.\n5. If the dry-run has valid actions, no issues, and no failed required pre-open validation checks, run the same supervisor command with `--submit-actions`. The unified live-submit guard is the only live authority; do not bypass it for a stale brief, skipped quote check, expired live-control, or paper tournament selection.\n6. Refresh the premarket brief again after the final supervisor packet.\n7. Email only for CRITICAL/NOTABLE structured alerts or legacy `notify: true`.\n\nFocus: overnight validation, rolling premarket brief, fresh premarket quotes/news, open orders, current positions/P&L, live sizing room/buying power, ranked candidates, and paper-tournament advisory context. Prefer controlled dips with clean support/volume; avoid falling knives; do not chase sharp green spikes; sell/close spikes or risk-threshold breaks when the packet says so. Read the current live posture from `config/risk_envelope.yaml`, `results/policy/live_control.json`, broker buying power, and the unified live gate. Current handoff posture is fail-closed unless live-control and risk-envelope evidence prove otherwise; do not assume a no-cap mode or any fixed cap from memory.\n\nUrgent notes/emails must be short and human-readable with: Plain English, What happened, Problem, Money today, Live account, Paper account, Open orders, Submitted orders, Need from you. Never ask for per-trade approval or code-level fixes."
