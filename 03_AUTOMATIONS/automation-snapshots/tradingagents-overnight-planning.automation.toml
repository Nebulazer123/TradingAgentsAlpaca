prompt = "Run the bounded, analysis-only overnight TradingAgents planning pass after U.S. equity extended-hours trading is closed, including weekend nights when the next market open needs a fresh premarket-readable report.\n\nStart with compact context: run `python scripts/automation_context_snapshot.py --write`, then read `results/_context/latest-summary.json`, `results/_context/latest-flags.json`, and `results/_context/recent-deltas.md`. Open raw packets only when those files flag blockers, stale data, failed graph runs, changed candidates, quality failures, depleted critical sources, or unresolved model/runtime issues.\n\nUse the repo executable directly: `& \"C:\\Users\\Corbin\\Documents\\Coding projects\\TradingAgents-main\\.venv\\Scripts\\tradingagents.exe\" ...`.\n\nRequired sequence:\n1. Run `alpaca check` through the repo executable.\n2. Run `research automation-orchestration-plan --json-output --output-dir results/research_batches --model-telemetry-dir results/model_telemetry --research-context-dir results/research_evidence/orchestration_context`.\n3. Refresh source-quality before ranking with `research source-quality-review --json-output --compact-json-output`, then keep `results/source_quality/latest.json` as the overnight source-quality review path. If stale sources need refresh, missing/invalid packets appear, or unreadable sources appear, downrank them and continue with usable free/unlimited/MCP/cached backups.\n4. Resolve due Agent Intelligence Ledger forecasts with `research agent-ledger-resolve --json-output`.\n5. Run `alpaca plan-overnight --json-output --log-dir results/overnight_plans --overnight-graph-profile compact --overnight-llm-provider google --overnight-quick-think-llm gemini-2.5-flash-lite --overnight-deep-think-llm gemini-2.5-flash --full-graph-tickers 3 --per-ticker-timeout-minutes 25 --time-budget-minutes 90 --overnight-max-completion-tokens 220 --source-quality-review-path results/source_quality/latest.json --source-quality-ordering`.\n6. For up to three valid ranked candidates, run `research ticker-provider-bundle --symbol TICKER --json-output --max-packets-per-need 3 --source-quality-review-path results/source_quality/latest.json --source-quality-ordering`. If one provider is out of calls or blocked, record it and keep using remaining APIs, RSS, MCP/social, cached, and unlimited/free sources.\n7. Summarize earned agent influence with `research agent-ledger-summary --json-output`.\n8. Confirm the overnight packet is `analysis_only: true`, has a packet path, quality metadata, source-quality ordering/downrank evidence in `research_context.watchlists.source_quality`, ranked candidates or clear fallback results, and `submitted: []`.\n9. Refresh `alpaca premarket-brief --json-output`.\n10. Post a concise thread note with packet paths, top candidates, full-graph/fallback/failure counts, graph config, source-quality stale/downrank counts, blockers, and reminder that no orders were submitted. Email only if neither the overnight packet nor premarket brief can be produced, or if account/data/model checks are blocked.\n\nThis automation must never place live or paper orders. It may use broad research sources and overlapping evidence, but output is context only. Ask only for ops-level decisions such as missing credentials, unavailable local/Mac models, depleted critical sources, kill-switch/risk-envelope choices, or blockers the bot cannot self-heal.\n\nExplain blockers like Corbin is 15 using short labels: Plain English, What happened, Problem, Accounts touched or not touched, Money today, Need from you. Do not ask for per-trade approval, per-promotion approval, or code-level fixes.\n\nThe compact graph profile preserves the original TradingAgents lanes while using bounded prefetch analysts for local Ollama stability. Current holdings are portfolio context only, not a ranking bonus."
