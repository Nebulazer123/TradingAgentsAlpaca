prompt = "Manage TradingAgents automation status before the market-day jobs begin.\n\nStart by inspecting automation configs only. You may run `python scripts/automation_context_snapshot.py --write` to refresh compact context. After any status-only controller work, run `.\\.venv\\Scripts\\tradingagents.exe research controller-patrol --automation-id tradingagents-automation-wake-controller --json-output` to write an analysis-only controller evidence packet under `results/control_plane_patrol/`. Do not run TradingAgents broker/order commands, submit orders, send emails, or edit repo files except for the allowed compact context refresh and controller patrol packet. Do not modify this wake controller, the sleep controller, or the night-shift supervisor.\n\nKnown TradingAgents Codex automations:\n- hourly-market-supervisor\n- paper-strategy-tournament-runner\n- market-supervisor-15-min-before-open\n- market-supervisor-30-min-after-open\n- market-supervisor-30-min-before-close\n- market-supervisor-15-min-after-close\n- tradingagents-daily-market-report\n- tradingagents-overnight-planning\n- tradingagents-automation-sleep-controller\n- tradingagents-automation-wake-controller\n- tradingagents-night-shift-supervisor\n\nKnown one-off/follow-up automation:\n- fetch-tradingagents-deep-research-report is a Browser/report heartbeat. Classify it as a follow-up task, report its status if relevant, and do not pause/resume it unless the user explicitly asks.\n\nRepo-local `.codex/hooks` and the n8n status-runner POC are not Codex cron automations and should not be paused or resumed by this controller. If a future Codex automation is created for n8n, classify it by prompt/cwd first; only manage it when it clearly belongs to the TradingAgents market-day or overnight group.\n\nDiscovery rule: inspect `C:\\cm\\automations\\*\\automation.toml` for automations whose cwd is `C:\\Users\\Corbin\\Documents\\Coding projects\\TradingAgents-main` or whose prompt clearly says TradingAgents. Exclude this wake controller, the sleep controller, and the night-shift supervisor from pause/resume decisions. Unknown new automations should be reported but not changed.\n\nDecision process:\n1. Determine whether today in America/Chicago is a regular U.S. equities trading day. Prefer an official Alpaca/NYSE calendar check; if unavailable, fall back to Monday-Friday as trading days and weekends as non-trading.\n2. If today is a trading day, mark the market-day group ACTIVE before the 8:15 AM premarket supervisor can run: hourly supervisor, paper tournament, market-window supervisors, daily report, and any future discovered market-day TradingAgents automations.\n3. If today is not a trading day, mark the same market-day group PAUSED.\n4. Mark overnight research/planning PAUSED after the overnight window has had time to finish.\n5. Keep the sleep controller, wake controller, and night-shift supervisor ACTIVE.\n6. Preserve each managed automation's prompt, schedule, model, reasoning effort, execution environment, and cwd; change only status unless an existing config is missing and must be reported.\n7. Post one concise status note listing the market-day decision, statuses changed, unchanged count, known follow-up jobs, discovered unknown ids if any, and blockers."
status = "PAUSED"
